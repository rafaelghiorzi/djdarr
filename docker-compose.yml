services:

  # ── Container A: página dos fãs (público) ──────────────────────────────────
  fans_page:
    build:
      context: ./fans
    # ports:
    #   - "8000:8000"   # só em desenvolvimento local; em produção o acesso é via cloudflared
    environment:
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      TURNSTILE_SITE_KEY:   ${TURNSTILE_SITE_KEY}
      CONTAINER_B_URL:      http://dj_panel:8001
      FAN_PAGE_ORIGIN:      ${FAN_PAGE_ORIGIN:-}
    networks:
      - djdarr_net
    restart: unless-stopped
    depends_on:
      - dj_panel

  # ── Container B: painel do DJ + API + worker de download ──────────────────
  dj_panel:
    build:
      context: ./painel
    # ports:
    #   - "8501:8501"   # só em desenvolvimento local; em produção o acesso é via cloudflared + Cloudflare Access
    #   # porta 8001 (API interna) NUNCA deve ser exposta ao host nem ao túnel
    volumes:
      - ${DOWNLOADS_PATH:?Defina DOWNLOADS_PATH no .env}:/downloads
      - djdarr_data:/data
    environment:
      DOWNLOADS_PATH:     /downloads
      AUDIO_FORMAT:       ${AUDIO_FORMAT:-mp3}
      MAX_QUEUE_SIZE:     ${MAX_QUEUE_SIZE:-50}
      MAX_PENDING_PER_IP: ${MAX_PENDING_PER_IP:-3}
      DOWNLOAD_WORKERS:   ${DOWNLOAD_WORKERS:-2}
    networks:
      - djdarr_net
    restart: unless-stopped

  # ── Cloudflare Tunnel: expõe fans_page e dj_panel na internet ──────────────
  # Ingress (hostname público → serviço) é configurado no dashboard do túnel,
  # não aqui. Este container só conecta o túnel usando o token do dashboard.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Defina CLOUDFLARE_TUNNEL_TOKEN no .env}
    networks:
      - djdarr_net
    restart: unless-stopped
    depends_on:
      - fans_page
      - dj_panel

networks:
  djdarr_net:
    driver: bridge

volumes:
  djdarr_data:   # volume para o SQLite (/data/djdarr.db dentro do container_b)
